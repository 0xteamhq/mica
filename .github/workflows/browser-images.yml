name: browser-images

# Build + push every browser image listed in the root `browser-images.json`
# manifest to GHCR (ghcr.io/<owner>/<name>). Each entry carries its own
# version; bump one and merge to main to cut a new image. The matrix is
# generated from the manifest, so adding a browser = adding one JSON entry
# (plus its docker/ directory) — no workflow edits needed.
on:
  push:
    branches: [main]
    paths:
      - browser-images.json
      - docker/**
      - .github/workflows/browser-images.yml
  # On PRs, run a dry-run (build, no push) so the matrix + Dockerfiles are
  # verified without publishing. See `push`/`platforms` conditionals below.
  pull_request:
    paths:
      - browser-images.json
      - docker/**
      - .github/workflows/browser-images.yml
  # Manual run. Flip `push: true` to actually publish to GHCR; left false
  # it's a dry-run build (same as a PR). Available once this workflow is on
  # the default branch.
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR (false = dry-run build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # Turn the manifest into a build matrix (one job per image entry).
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          matrix="$(jq -c '{include: .images}' browser-images.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix -> $matrix"

  build-push:
    name: ${{ matrix.name }}:${{ matrix.version }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Publish when pushing to main, or on a manual run with push=true.
    # PRs (and dispatch with push=false) are dry-run builds, no login/push.
    env:
      DO_PUSH: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # Only needed when we actually push — skip for dry-run builds.
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # e.g. ghcr.io/0xteamhq/lightpanda:nightly + :latest
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Publish the image's declared arches (some browsers ship amd64
          # only — e.g. chrome-headless-shell has no linux-arm64 binary).
          # Dry-run builds are always single-arch amd64 for speed.
          platforms: ${{ env.DO_PUSH == 'true' && matrix.platforms || 'linux/amd64' }}
          build-args: |
            ${{ matrix.versionArg }}=${{ matrix.version }}
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so unrelated images don't share layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
