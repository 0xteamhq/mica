{{- if and .Values.rbac.create (eq .Values.rbac.scope "namespace") -}}
{{- $namespaces := prepend .Values.rbac.extraNamespaces .Release.Namespace | uniq -}}
{{- range $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mica.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "mica.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mica.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mica.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end -}}
