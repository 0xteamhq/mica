{{- if and .Values.rbac.create (eq .Values.rbac.scope "cluster") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mica.fullname" . }}
  labels:
    {{- include "mica.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mica.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mica.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
