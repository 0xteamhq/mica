# mica + MinIO — artifact storage demo.
#
# Shows how session artifacts (recordings `/{id}.mp4`, logs `/{id}.log`)
# flow to S3-compatible object storage:
#
#   session ends -> mica emits FileCreated -> S3Uploader PUTs the file
#   to the `mica-artifacts` bucket in MinIO.
#
# mica stages artifacts on local disk first (--video-output-dir /
# --log-output-dir) and uploads on session stop, so the local dir is a
# spool, not the system of record.
#
# Run:  docker compose -f deploy/compose/docker-compose.yml up --build
#   mica dashboard : http://localhost:4444/admin
#   MinIO console  : http://localhost:9001  (minioadmin / minioadmin)

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket mica uploads to.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/mica-artifacts;
      echo 'bucket mica-artifacts ready';
      "

  mica:
    build:
      context: ../..            # repo root — Dockerfile builds with --features ui
      dockerfile: Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "4444:4444"             # WebDriver + /admin dashboard
    environment:
      # --- S3 / MinIO ---
      MICA_S3_BUCKET: mica-artifacts
      MICA_S3_REGION: us-east-1
      # Path-style addressing (endpoint/bucket/key) — required for MinIO.
      MICA_S3_FORCE_PATH_STYLE: "true"
      # Custom endpoint is read by the AWS SDK from this standard var.
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Optional: key layout in the bucket, e.g. "recordings/$browserName/$fileName"
      # MICA_S3_PREFIX: recordings
    command:
      - --conf=/etc/mica/browsers.json
      - --listen=:4444
      - --video-output-dir=/var/lib/mica/video   # local spool before upload
      - --log-output-dir=/var/lib/mica/logs
    volumes:
      - ./browsers.json:/etc/mica/browsers.json:ro
      - mica-spool:/var/lib/mica
      # DockerBackend launches browser containers as siblings on the host
      # daemon. NOTE: docker-out-of-docker networking means mica must be
      # able to reach the browser containers' published ports — on Linux
      # add `network_mode: host` (and drop the ports mapping); on Docker
      # Desktop/OrbStack run mica on the host instead for real sessions.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  minio-data:
  mica-spool:
