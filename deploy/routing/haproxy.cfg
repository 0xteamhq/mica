# HAProxy in front of N mica replicas — non-K8s deployment.
# Sticky on the WebDriver session id parsed from the URL so every
# session continues to land on the replica that created it.

global
    log stdout local0
    maxconn 8192

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    log global
    option httplog

frontend mica_frontend
    bind *:4444
    default_backend mica_backend
    # Long-lived WebSocket support for /vnc, /session/{id}/bidi.
    option http-keep-alive

backend mica_backend
    balance roundrobin
    # Stick on the session id segment of /wd/hub/session/{id}/...
    stick-table type string len 64 size 100k expire 1h
    stick on path,regsub(^/wd/hub/session/([^/]+).*,\1) if { path_beg /wd/hub/session/ }
    # Routine health check.
    option httpchk GET /ping
    server mica1 mica-1:4444 check
    server mica2 mica-2:4444 check
    server mica3 mica-3:4444 check
