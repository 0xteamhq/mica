[package]
name = "mica"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = """
Mica is a browser grid for the T-system. It runs as a single Rust binary and a \
single Docker container — the same artifact you run locally is what runs in \
production, anywhere in the world.
"""
repository = "https://github.com/0xteam/mica"
readme = "README.md"
keywords = ["webdriver", "selenium", "browser", "grid", "docker"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
bollard = "0.16"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tokio-tungstenite = "0.23"
futures = "0.3"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
bytes = "1"
humantime = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
arc-swap = "1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
serde_yaml = "0.9"
http-body-util = "0.1"
